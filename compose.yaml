services:
  neo4j:
    image: neo4j:2026.09.0

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:7474/ || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      neo4j:
        condition: service_healthy

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DATABASE: "${NEO4J_DATABASE}"

    restart: "no"

  visualizer:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      - python
      - -m
      - streamlit
      - run
      - src/visualizer/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    depends_on:
      neo4j:
        condition: service_healthy
      catalog:
        condition: service_completed_successfully

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DATABASE: "${NEO4J_DATABASE}"

    ports:
      - "8501:8501"

    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs: